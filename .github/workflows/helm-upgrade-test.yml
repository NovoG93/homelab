name: Helm upgrade test

'on':
  pull_request:
    branches: [ "main" ]
    paths:
      - "apps/**"
      - "helmCharts/immich-0.13.2/**"
      - "hack/check-immich-migration-stage.sh"
      - "hack/tests/immich-storage-preparation.sh"
      - "core/**"
      - "tools/**"
      - "kind/**"
      - "renovate.json"
      - ".github/workflows/helm-upgrade-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: helm-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    name: Render and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        shell: bash
        run: |
          bash hack/tasks/install-tools.bash

      - name: Verify Immich migration safety contract
        shell: bash
        run: bash hack/check-immich-migration-stage.sh

      - name: Verify Immich storage preparation
        shell: bash
        run: bash hack/tests/immich-storage-preparation.sh

      - name: Focused monitoring render contract
        shell: bash
        run: |
          bash hack/tests/monitoring-render.sh

      - name: Render changed Kustomizations
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mkdir -p manifests

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            find apps core tools kind \
              -type f \
              \( -name kustomization.yaml -o -name Kustomization \) \
              -print |
              while IFS= read -r file; do dirname "$file"; done |
              sort -u > /tmp/render-directories.txt
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              hack/ci/changed-application-directories.bash --native \
              > /tmp/render-directories.txt
          fi

          while IFS= read -r directory; do
            output="manifests/$(echo "$directory" | tr '/' '_').yaml"
            build_args=(--enable-helm)
            if [[ "$directory" == kind/* ]]; then
              build_args+=(--load-restrictor LoadRestrictionsNone)
            fi

            echo "::group::Rendering ${directory}"
            kustomize build "${build_args[@]}" "$directory" > "$output"
            echo "::endgroup::"
          done < /tmp/render-directories.txt

      - name: Validate Kubernetes schemas
        shell: bash
        run: |
          set -euo pipefail

          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            manifests/

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v7
        with:
          name: rendered-manifests
          path: manifests/
          retention-days: 7

  kind:
    name: Deploy into kind
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        shell: bash
        run: |
          bash hack/tasks/install-tools.bash

      - name: Create kind cluster
        shell: bash
        run: |
          bash hack/ci/deploy-kind.bash --cluster-name homelab-ci --skip-initial-deploy

      - name: Install Kind CNI prerequisite
        shell: bash
        run: |
          set -euo pipefail

          manifest="$(mktemp)"
          prerequisites="$(mktemp)"
          trap 'rm -f "$manifest" "$prerequisites"' EXIT

          kustomize build \
            --enable-helm \
            --load-restrictor LoadRestrictionsNone \
            kind/core/calico > "$manifest"
          yq eval-all \
            'select(.kind == "Namespace" or .kind == "CustomResourceDefinition")' \
            "$manifest" > "$prerequisites"
          kubectl apply --server-side -f "$prerequisites"

          mapfile -t crds < <(
            yq eval-all --no-doc \
              'select(.kind == "CustomResourceDefinition") | .metadata.name' \
              "$manifest"
          )
          for crd in "${crds[@]}"; do
            kubectl wait --for=condition=Established --timeout=2m "crd/${crd}"
          done

          kubectl apply --server-side -f "$manifest"
          kubectl wait --for=condition=Ready --timeout=5m nodes --all

      - name: Determine changed application directories
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            find kind -mindepth 3 -maxdepth 3 -type f \
              \( -name kustomization.yaml -o -name Kustomization \) \
              -print |
              while IFS= read -r file; do dirname "$file"; done |
              sort -u > /tmp/changed-directories.txt
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              hack/ci/changed-application-directories.bash \
              > /tmp/changed-directories.txt
          fi

          cat /tmp/changed-directories.txt

          {
            echo "directories<<EOF"
            cat /tmp/changed-directories.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Immich CI prerequisites
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(mktemp)"
          prerequisites="$(mktemp)"
          operator_manifest="$(mktemp)"
          trap 'rm -f "$manifest" "$prerequisites" "$operator_manifest"' EXIT

          # Native Immich changes have no Kind overlay. A fresh Kind cluster
          # needs ESO's API/webhook and the destination namespace first.
          kustomize build --enable-helm kind/tools/external-secret-operator > "$manifest"
          if yq -e 'select(.kind == "Job" and .metadata.annotations."helm.sh/hook" == "pre-delete")' "$manifest" >/dev/null 2>&1; then
            echo 'Refusing to raw-apply an ESO pre-delete Helm hook' >&2
            exit 1
          fi
          kubectl create namespace external-secret-operator --dry-run=client -o yaml |
            kubectl apply --server-side -f -
          yq eval-all 'select(.kind == "Namespace" or .kind == "CustomResourceDefinition")' \
            "$manifest" > "$prerequisites"
          kubectl apply --server-side -f "$prerequisites"
          mapfile -t crds < <(yq eval-all --no-doc \
            'select(.kind == "CustomResourceDefinition") | .metadata.name' "$manifest")
          [[ "${#crds[@]}" -gt 0 ]] || { echo 'ESO CRDs are missing' >&2; exit 1; }
          for crd in "${crds[@]}"; do
            kubectl wait --for=condition=Established --timeout=2m "crd/${crd}"
          done
          # Vault-backed stores belong to production and require a ready
          # webhook; Kind needs only the operator and its CRDs.
          yq eval-all 'select(.kind != "ClusterSecretStore")' \
            "$manifest" > "$operator_manifest"
          kubectl apply --server-side -f "$operator_manifest"
          for deployment in external-secrets external-secrets-cert-controller external-secrets-webhook; do
            kubectl -n external-secret-operator rollout status \
              "deployment/${deployment}" --timeout=5m
          done
          kubectl create namespace immich --dry-run=client -o yaml |
            kubectl apply --server-side -f -

      - name: Server-side validate changed applications
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s /tmp/changed-directories.txt ]]; then
            echo "No application directories changed."
            exit 0
          fi

          while IFS= read -r directory; do
            [[ "$directory" == "kind/core/calico" ]] && continue
            [[ -f "${directory}/kustomization.yaml" ]] || continue
            build_args=(--enable-helm)
            if [[ "$directory" == kind/* ]]; then
              build_args+=(--load-restrictor LoadRestrictionsNone)
            fi

            echo "::group::Server-side validation: ${directory}"
            manifest="$(mktemp)"
            kustomize build "${build_args[@]}" "$directory" > "$manifest"

            if [[ "$directory" == kind/* ]]; then
              prerequisites="$(mktemp)"
              yq eval-all 'select(.kind == "Namespace" or .kind == "CustomResourceDefinition")' \
                "$manifest" > "$prerequisites"
              if [[ -s "$prerequisites" ]]; then
                kubectl apply --server-side -f "$prerequisites"
                mapfile -t crds < <(yq eval-all --no-doc 'select(.kind == "CustomResourceDefinition") | .metadata.name' "$manifest")
                if [[ "${#crds[@]}" -gt 0 ]]; then
                  crd_args=()
                  for crd in "${crds[@]}"; do
                    crd_args+=("crd/${crd}")
                  done
                  kubectl wait --for=condition=Established --timeout=2m \
                    "${crd_args[@]}"
                fi
              fi
              rm -f "$prerequisites"
            fi

            kubectl apply \
              --server-side \
              --dry-run=server \
              --validate=true \
              -f "$manifest"
            rm -f "$manifest"

            echo "::endgroup::"
          done < /tmp/changed-directories.txt

      - name: Deploy changed applications
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r directory; do
            [[ "$directory" == "kind/core/calico" ]] && continue
            [[ -f "${directory}/kustomization.yaml" ]] || continue
            build_args=(--enable-helm)
            if [[ "$directory" == kind/* ]]; then
              build_args+=(--load-restrictor LoadRestrictionsNone)
            fi

            echo "::group::Deploying ${directory}"

            kustomize build "${build_args[@]}" "$directory" |
              kubectl apply --server-side -f -

            echo "::endgroup::"
          done < /tmp/changed-directories.txt

      - name: Wait for workloads
        shell: bash
        run: |
          set -euo pipefail

          # Give controllers time to create dependent workloads.
          sleep 10

          failed=0

          while IFS= read -r item; do
            kind="${item%%/*}"
            rest="${item#*/}"
            namespace="${rest%%/*}"
            name="${rest#*/}"

            case "$kind" in
              deployment)
                kubectl rollout status \
                  "deployment/${name}" \
                  -n "$namespace" \
                  --timeout=5m || failed=1
                ;;
              statefulset)
                kubectl rollout status \
                  "statefulset/${name}" \
                  -n "$namespace" \
                  --timeout=5m || failed=1
                ;;
              daemonset)
                kubectl rollout status \
                  "daemonset/${name}" \
                  -n "$namespace" \
                  --timeout=5m || failed=1
                ;;
            esac
          done < <(
            kubectl get deployments,statefulsets,daemonsets \
              --all-namespaces \
              -o json |
            jq -r '
              .items[] |
              "\(.kind | ascii_downcase)/\(.metadata.namespace)/\(.metadata.name)"
            '
          )

          exit "$failed"

      - name: Detect unhealthy pods
        shell: bash
        run: |
          set -euo pipefail

          kubectl get pods --all-namespaces -o wide

          unhealthy="$(
            kubectl get pods --all-namespaces -o json |
              jq -r '
                .items[]
                | select(
                    .status.phase == "Failed"
                    or (
                      .status.containerStatuses // []
                      | any(
                          .state.waiting.reason
                          | IN(
                              "CrashLoopBackOff",
                              "CreateContainerConfigError",
                              "ErrImagePull",
                              "ImagePullBackOff",
                              "InvalidImageName"
                            )
                        )
                    )
                  )
                | "\(.metadata.namespace)/\(.metadata.name)"
              '
          )"

          if [[ -n "$unhealthy" ]]; then
            echo "Unhealthy pods:"
            echo "$unhealthy"
            exit 1
          fi

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          kubectl get all --all-namespaces -o wide || true
          kubectl get events --all-namespaces \
            --sort-by=.metadata.creationTimestamp || true
          kubectl describe pods --all-namespaces || true

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name homelab-ci
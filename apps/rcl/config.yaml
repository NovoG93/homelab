apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-dev
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_DB
    remoteRef:
      key: apps/rcl/db-credentials
      property: POSTGRES_DB
  - secretKey: POSTGRES_USER
    remoteRef:
      key: apps/rcl/db-credentials
      property: POSTGRES_USER
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: apps/rcl/db-credentials
      property: POSTGRES_PASSWORD
  - secretKey: SECRET_KEY
    remoteRef:
      key: apps/rcl/db-credentials
      property: SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-dev
    kind: ClusterSecretStore
  target:
    name: backend-credentials
    creationPolicy: Owner
  data:
  - secretKey: DJANGO_ADMIN_USERNAME
    remoteRef:
      key: apps/rcl/backend-credentials
      property: DJANGO_ADMIN_USERNAME
  - secretKey: DJANGO_ADMIN_PASSWORD
    remoteRef:
      key: apps/rcl/backend-credentials
      property: DJANGO_ADMIN_PASSWORD
  - secretKey: CORS_ALLOWED_ORIGINS
    remoteRef:
      key: apps/rcl/backend-credentials
      property: CORS_ALLOWED_ORIGINS
  - secretKey: ALLOWED_HOSTS
    remoteRef:
      key: apps/rcl/backend-credentials
      property: ALLOWED_HOSTS
  - secretKey: RUN_SEED_DATA
    remoteRef:
      key: apps/rcl/backend-credentials
      property: RUN_SEED_DATA
  - secretKey: EMAIL_BACKEND
    remoteRef:
      key: apps/rcl/backend-credentials
      property: EMAIL_BACKEND
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-mail-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-dev
    kind: ClusterSecretStore
  target:
    name: admin-mail-credentials
    creationPolicy: Owner
  data:
  - secretKey: EMAIL_HOST
    remoteRef:
      key: apps/rcl/admin-mail-credentials
      property: EMAIL_HOST
  - secretKey: EMAIL_PORT
    remoteRef:
      key: apps/rcl/admin-mail-credentials
      property: EMAIL_PORT
  - secretKey: EMAIL_HOST_USER
    remoteRef:
      key: apps/rcl/admin-mail-credentials
      property: EMAIL_HOST_USER
  - secretKey: EMAIL_HOST_PASSWORD
    remoteRef:
      key: apps/rcl/admin-mail-credentials
      property: EMAIL_HOST_PASSWORD
  - secretKey: EMAIL_USE_SSL
    remoteRef:
      key: apps/rcl/admin-mail-credentials
      property: EMAIL_USE_SSL
  - secretKey: EMAIL_USE_TLS
    remoteRef:
      key: apps/rcl/admin-mail-credentials
      property: EMAIL_USE_TLS
  - secretKey: DEFAULT_FROM_EMAIL
    remoteRef:
      key: apps/rcl/admin-mail-credentials
      property: DEFAULT_FROM_EMAIL
  - secretKey: ADMIN_EMAIL
    remoteRef:
      key: apps/rcl/admin-mail-credentials
      property: ADMIN_EMAIL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  EMAIL_TIMEOUT: "15"
  POSTGRES_HOST: db-service
  POSTGRES_PORT: "5432"
  MTLS_TRUSTED_PROXY_CIDRS: "10.0.76.6/32"
  MTLS_CLIENT_USER_MAP: "admin-client:rcl-mcp"

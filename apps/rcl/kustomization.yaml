apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomization

namespace: rcl


resources:
- config.yaml
- virtualserver-frontend.yaml
- virtualserver-backend.yaml
- virtualserver-api.yaml
- httproute.yaml
- backend.yaml
- email-outbox-cronjob.yaml
- resource-migration-job.yaml
- frontend.yaml
- db.yaml
- registry-secret.yaml
- mtls-cert.yaml
- mtls-nginx-ca-secret.yaml
- mtls-policy.yaml


generatorOptions:
  disableNameSuffixHash: true

images:
- name: ghcr.io/robotics-content-lab/website/backend
  digest: sha256:16ee9f4095837c25be0cfab53288eb3c6c6296b84a6e8d1a219e7167ab89c160
- name: ghcr.io/robotics-content-lab/website/frontend
  digest: sha256:d0bdc808d02289297fbff0e787d61d16579242ce2d51157ec81dfaa237b92255

patches:
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/tolerations
      value: []
    - op: add
      path: /spec/template/spec/tolerations/-
      value:
        key: apps
        operator: Equal
        value: "true"
        effect: NoSchedule
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: apps
                    operator: Exists
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-registry

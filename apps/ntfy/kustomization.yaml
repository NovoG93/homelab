apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomization

helmGlobals:
  chartHome: ../../helmCharts/

resources:
- virtualserver.yaml
- httproute.yaml
- es-ntfy.yaml

helmCharts:
- includeCRDs: true
  name: ntfy
  repo: oci://oci.trueforge.org/truecharts
  version: 13.8.0
  releaseName: ntfy
  namespace: ntfy
  valuesFile: values.yaml


patches:
  - target:
      kind: Deployment
      name: ntfy
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ntfy
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: apps
                          operator: Exists

generatorOptions:
  disableNameSuffixHash: true

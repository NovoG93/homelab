apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: obsidian-couchdb
  annotations:
    # external-dns will read the host from .spec.host
    external-dns.alpha.kubernetes.io/hostname: "couchdb.novotny.live"
  labels:
    tailscale.com/funnel: "false"
spec:
  externalDNS:
    enable: true
  host: couchdb.novotny.live
  tls:
    secret: wildcard-tls
  upstreams:
  - name: couchdb
    service: obsidian-svc-couchdb
    port: 5984
  routes:
  - path: /
    action:
      pass: couchdb
    location-snippets: |
      set $cors_allowed_origin $http_origin;
      # Allow only the three origins we whitelisted in CouchDB
      if ($http_origin ~* "^https?://|app://obsidian.md|capacitor://localhost$") {
        set $cors_allowed_origin $http_origin;
      }
      more_set_headers "Access-Control-Allow-Origin: $cors_allowed_origin";
      more_set_headers 'Access-Control-Allow-Credentials: true';
      more_set_headers 'Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS';
      more_set_headers 'Access-Control-Allow-Headers: Authorization, Content-Type, *';

      if ($request_method = OPTIONS) { return 204; }
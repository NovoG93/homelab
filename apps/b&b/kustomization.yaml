apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomization

namespace: b-and-b


resources:
- config.yaml
- virtualserver.yaml
- httproute.yaml
- backend.yaml
- frontend.yaml
- db.yaml
- registry-secret.yaml



generatorOptions:
  disableNameSuffixHash: true

patches:
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/tolerations
      value: []
    - op: add
      path: /spec/template/spec/tolerations/-
      value:
        key: apps
        operator: Equal
        value: "true"
        effect: NoSchedule
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: apps
                    operator: Exists
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-registry
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-registry
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-dev
    kind: ClusterSecretStore
  target:
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "novog93",
                "password": "{{ .token }}",
                "auth": "{{ printf "novog93:%s" .token | b64enc }}"
              }
            }
          }
    name: ghcr-registry
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: globals/registry-token/ghcr-b-and-b
      property: token



apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-dev
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_DB
    remoteRef:
      key: apps/beans-and-bites/db-credentials
      property: POSTGRES_DB
  - secretKey: POSTGRES_USER
    remoteRef:
      key: apps/beans-and-bites/db-credentials
      property: POSTGRES_USER
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: apps/beans-and-bites/db-credentials
      property: POSTGRES_PASSWORD
  - secretKey: SECRET_KEY
    remoteRef:
      key: apps/beans-and-bites/db-credentials
      property: SECRET_KEY
  - secretKey: MTLS_ALLOWED_CLIENTS
    remoteRef:
      key: apps/beans-and-bites/db-credentials
      property: MTLS_ALLOWED_CLIENTS
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-dev
    kind: ClusterSecretStore
  target:
    name: backend-credentials
    creationPolicy: Owner
  data:
  - secretKey: DJANGO_ADMIN_USERNAME
    remoteRef:
      key: apps/beans-and-bites/backend-credentials
      property: DJANGO_ADMIN_USERNAME
  - secretKey: DJANGO_ADMIN_PASSWORD
    remoteRef:
      key: apps/beans-and-bites/backend-credentials
      property: DJANGO_ADMIN_PASSWORD
  - secretKey: CORS_ALLOWED_ORIGINS
    remoteRef:
      key: apps/beans-and-bites/backend-credentials
      property: CORS_ALLOWED_ORIGINS
  - secretKey: ALLOWED_HOSTS
    remoteRef:
      key: apps/beans-and-bites/backend-credentials
      property: ALLOWED_HOSTS
  - secretKey: RUN_SEED_DATA
    remoteRef:
      key: apps/beans-and-bites/backend-credentials
      property: RUN_SEED_DATA
  - secretKey: EMAIL_BACKEND
    remoteRef:
      key: apps/beans-and-bites/backend-credentials
      property: EMAIL_BACKEND
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-mail-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-dev
    kind: ClusterSecretStore
  target:
    name: admin-mail-credentials
    creationPolicy: Owner
  data:
  - secretKey: EMAIL_HOST
    remoteRef:
      key: apps/beans-and-bites/admin-mail-credentials
      property: EMAIL_HOST
  - secretKey: EMAIL_PORT
    remoteRef:
      key: apps/beans-and-bites/admin-mail-credentials
      property: EMAIL_PORT
  - secretKey: EMAIL_HOST_USER
    remoteRef:
      key: apps/beans-and-bites/admin-mail-credentials
      property: EMAIL_HOST_USER
  - secretKey: EMAIL_HOST_PASSWORD
    remoteRef:
      key: apps/beans-and-bites/admin-mail-credentials
      property: EMAIL_HOST_PASSWORD
  - secretKey: EMAIL_USE_SSL
    remoteRef:
      key: apps/beans-and-bites/admin-mail-credentials
      property: EMAIL_USE_SSL
  - secretKey: EMAIL_USE_TLS
    remoteRef:
      key: apps/beans-and-bites/admin-mail-credentials
      property: EMAIL_USE_TLS
  - secretKey: DEFAULT_FROM_EMAIL
    remoteRef:
      key: apps/beans-and-bites/admin-mail-credentials
      property: DEFAULT_FROM_EMAIL
  - secretKey: ADMIN_EMAIL
    remoteRef:
      key: apps/beans-and-bites/admin-mail-credentials
      property: ADMIN_EMAIL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  POSTGRES_HOST: db-service
  POSTGRES_PORT: "5432"

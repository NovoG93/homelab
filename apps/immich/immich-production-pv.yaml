apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    pv.kubernetes.io/provisioned-by: smb.csi.k8s.io
  name: immich-production-smb
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
  csi:
    driver: smb.csi.k8s.io
    # Keep this handle distinct from the preserved original immich share.
    volumeHandle: smb-server.default.svc.cluster.local/immich-production##
    volumeAttributes:
      source: //192.168.0.173/immich-production
    nodeStageSecretRef:
      name: smb-creds
      namespace: immich

## This chart relies on the common library chart from bjw-s.
## The exact common dependency is vendored under helmCharts/immich-0.13.2.

# Shared values inherited by enabled Immich components.
controllers:
  main:
    containers:
      main:
        image:
          tag: v3.2.4
        env:
          REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
          IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'

immich:
  metrics:
    enabled: false
  persistence:
    library:
      existingClaim: immich-production-smb-claim
  configuration:
    trash:
      enabled: true
      days: 30
    storageTemplate:
      enabled: true
      template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"
  configurationKind: ConfigMap

# Keep all application components stopped in this first migration revision.
server:
  enabled: false
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.2.4
            pullPolicy: IfNotPresent
          env:
            DB_HOSTNAME: immich-postgres-rw.immich.svc.cluster.local
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-credentials
                  key: username
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-database-credentials
                  key: password
            DB_DATABASE_NAME: immich-db
  ingress:
    main:
      enabled: false

machine-learning:
  enabled: false
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.2.4
            pullPolicy: IfNotPresent
          env:
            TRANSFORMERS_CACHE: /cache
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      size: 10Gi
      accessMode: ReadWriteMany
      storageClass: nfs-client

defaultPodOptions:
  tolerations:
    - key: apps
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: apps
                operator: Exists

# Valkey is intentionally disabled until the database migration is adopted.
# Do not carry the old emptyDir/accessMode fields into this chart revision.
valkey:
  enabled: false

apiVersion: homelab.novotny.live/v1alpha1
kind: HomepageCatalog
entries:
  - id: vs-beans-and-bites
    group: virtualservers
    displayName: Beans & Bites
    description: Primary NGINX VirtualServer endpoint
    icon: mdi-food
    weight: 10
    enabled: true
    source:
      path: apps/beans-and-bites/virtualserver-frontend.yaml
      kind: VirtualServer
      name: beans-and-bites
      expectedHostname: beans-and-bites.novotny.live

  - id: vs-beans-and-bites-api
    group: virtualservers
    displayName: Beans & Bites API
    description: Beans & Bites API endpoint, intentionally not a launch target

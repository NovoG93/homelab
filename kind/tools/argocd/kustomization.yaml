apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomization
namespace: argocd

resources:
- ../../../tools/argocd
- namespace.yaml
- appSets

secretGenerator:
  - name: argocd-initial-admin-secret
    namespace: argocd
    literals:
      - password=admin
    type: Opaque

generatorOptions:
  disableNameSuffixHash: true

patches:
# delete any HttpRoute/ resource 
- patch: |-
    $patch: delete
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd
      namespace: argocd
- patch: |-
    $patch: delete
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: kind-dev-cluster
      namespace: argocd
- target:
    group: argoproj.io
    version: v1alpha1
    kind: ApplicationSet
    name: ^(apps|tools|core)-appset(-kind)?$
  patch: |-
    $patch: delete
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata:
      name: placeholder
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomization
namespace: argo

resources:
- ../../../tools/argo-workflows
- namespace.yaml


generatorOptions:
  disableNameSuffixHash: true

patches:
# delete any HttpRoute/ resource 
- patch: |-
    $patch: delete
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argo-workflows
      namespace: argo
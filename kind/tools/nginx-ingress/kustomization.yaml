apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomization

resources:
- ../../../tools/nginx-ingress
- namespace.yaml

patches:
- path: patch-hostport.json
  target:
    group: apps
    version: v1
    kind: Deployment
    name: nginx-ingress-controller
    namespace: nginx-ingress
- path: patch-node-selector.yaml


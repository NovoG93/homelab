apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: default
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    run: nginx
status:
  loadBalancer: {}
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx
  name: nginx
  namespace: default
spec:
  containers:
  - image: nginx:latest
    name: nginx
    ports:
    - containerPort: 80
    resources: {}
  tolerations:
  - key: "apps"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: nginx-test
  namespace: default
spec:
  host: nginx.127.0.0.1.nip.io
  tls:
    secret: wildcard-tls
  upstreams:
  - name: nginx
    service: nginx
    port: 80
  routes:
  - path: /
    action:
      pass: nginx

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomization

helmGlobals:
  chartHome: ./

helmCharts:
- name: certificate-provision
  version: 0.1.0
  releaseName: certificate-provision
  namespace: wildcard-tls
  valuesFile: values.yaml
  
generatorOptions:
  disableNameSuffixHash: true
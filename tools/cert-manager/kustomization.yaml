apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomization

helmGlobals:
  chartHome: ../../helmCharts-tools/

resources:
- secret-api.yaml
- issuer.yaml

helmCharts:
- includeCRDs: true
  name: cert-manager
  repo: https://charts.jetstack.io
  version: v1.17.2
  releaseName: cert-manager
  namespace: cert-manager
  valuesFile: values.yaml

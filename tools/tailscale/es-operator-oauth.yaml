apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-dev
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    deletionPolicy: Delete
  data:
    - secretKey: client_id
      remoteRef:
        conversionStrategy: Default	
        decodingStrategy: None
        metadataPolicy: None
        key: tools/tailscale/oauth-secret
        property: client_id
    - secretKey: client_secret
      remoteRef:
        conversionStrategy: Default	
        decodingStrategy: None
        metadataPolicy: None
        key: tools/tailscale/oauth-secret
        property: client_secret

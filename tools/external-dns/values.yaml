# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/external-dns/refs/tags/v0.19.0/charts/external-dns/values.schema.json

provider: pihole

env:
  - name: EXTERNAL_DNS_PIHOLE_SERVER
    value: "http://pihole-web.pihole.svc.cluster.local"
  - name: EXTERNAL_DNS_PIHOLE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: pihole-password
        key: password
  - name: EXTERNAL_DNS_PIHOLE_TLS_SKIP_VERIFY
    value: "true"
  - name: EXTERNAL_DNS_PIHOLE_API_VERSION
    value: "6"


# DNS policy and registry
policy: upsert-only
registry: noop

# Logging
logLevel: debug
logFormat: text

# Record types to manage
managedRecordTypes:
  - A
  - AAAA
  - CNAME

# Domain filtering
domainFilters:
  - novotny.live

# TXT record owner ID (not used with noop registry, but kept for reference)
txtOwnerId: external-dns-k8s

# Sources to watch
sources:
  - crd
  - service
  - ingress

# Extra arguments for external-dns
extraArgs:
  - --crd-source-apiversion=externaldns.nginx.org/v1
  - --crd-source-kind=DNSEndpoint

# Tolerations for node scheduling
tolerations:
  - key: "tools"
    operator: "Exists"
    effect: "NoSchedule"

# Node affinity
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: "tools"
              operator: "Exists"

# RBAC - ensure CRD permissions are enabled
rbac:
  create: true
  additionalPermissions:
    - apiGroups:
        - externaldns.nginx.org
      resources:
        - dnsendpoints
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - externaldns.nginx.org
      resources:
        - dnsendpoints/status
      verbs:
        - update

# Service account
serviceAccount:
  create: true
  automountServiceAccountToken: true

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
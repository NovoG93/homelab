apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: nginx-gateway-fabric

namespace: nginx-gateway

resources:
# 1. Install Standard Gateway API CRDs (v1.4.1)
# This URL is the official source. ArgoCD can fetch this directly.
- https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml
# 2. The Gateway definition we created above
- gateway.yaml

helmGlobals:
  chartHome: ../../helmCharts/

helmCharts:
- includeCRDs: true
  name: nginx-gateway-fabric
  repo: oci://ghcr.io/nginx/charts
  version: 2.7.0
  releaseName: nginx-gateway-fabric
  namespace: nginx-gateway
  valuesFile: values.yaml

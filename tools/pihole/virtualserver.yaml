apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: pihole
  annotations:
    # external-dns will read the host from .spec.host
    external-dns.alpha.kubernetes.io/hostname: "pihole.novotny.live"
  labels:
    tailscale.com/funnel: "false"
spec:
  externalDNS:
    enable: true
  host: pihole.novotny.live
  tls:
    secret: wildcard-tls
  upstreams:
  - name: pihole
    service: pihole-web
    port: 80
  routes:
  - path: /
    action:
      pass: pihole

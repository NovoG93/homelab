apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomization
namespace: argocd

resources:
- virtualserver.yaml
- appSets

helmGlobals:
  chartHome: ../../helmCharts/

helmCharts:
- includeCRDs: true
  name: argo-cd
  repo: https://argoproj.github.io/argo-helm
  version: 9.3.7
  releaseName: argocd
  namespace: argocd
  valuesFile: values.yaml

patches:
- path: patches/kustomize.yaml

generatorOptions:
  disableNameSuffixHash: true

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-controller:create-virtualservers
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
- apiGroups: ["k8s.nginx.org"]
  resources:
  - virtualservers
  verbs:
  - list
  - get
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:create-tailscale-ingress-from-virtualserver
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
- apiGroups: ["k8s.nginx.org"]
  resources:
  - virtualservers
  verbs:
  - get
  - watch
  - list
- apiGroups: ["networking.k8s.io"]
  resources:
  - ingresses
  verbs:
  - create
  - delete
  - update
  - patch
  - watch
global:
  tolerations:
    - key: "tools"
      operator: "Exists"
      effect: "NoSchedule"
  
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: "tools"
              operator: "Exists"

policyReportsCleanup:
  globalRegistry:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tags: v1.32.7
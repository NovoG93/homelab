apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomization

helmGlobals:
  chartHome: ../../helmCharts/

resources:
- roles
- clusterPolicies

helmCharts:
- includeCRDs: true
  name: kyverno
  repo: https://kyverno.github.io/kyverno
  version: 3.9.0
  releaseName: kyverno
  namespace: kyverno
  valuesFile: values.yaml



generatorOptions:
  disableNameSuffixHash: true